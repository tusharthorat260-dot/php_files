
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Fortune Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #e5e7ff, #dff7ff, #f5e9ff);
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 20px 60px #4c51a522;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #7657f6;
      margin-bottom: 12px;
    }

    h2 {
      text-align: center;
      color: #19213b;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #7d8498;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 13px;
      font-weight: bold;
      color: #37415a;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dfe3ee;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #7657f6;
      box-shadow: 0 0 0 3px #7657f61a;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 18px 0;
      font-size: 12px;
      color: #626b80;
      line-height: 1.5;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(100deg, #7657f6, #4e83f5);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { opacity: .9; }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #81899c;
      margin-top: 22px;
    }

    @media (max-width: 480px) {
      .container { padding: 25px 20px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">☁ Fortune Cloud</div>
    <h2>Create Your Account</h2>
    <p class="subtitle">Sign up to get started today.</p>

    <form action="submit.php" method="POST">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name"
             maxlength="100" autocomplete="name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email"
             maxlength="150" autocomplete="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone"
             maxlength="20" autocomplete="tel" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             minlength="8" maxlength="72"
             autocomplete="new-password" required>

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password"
             name="confirm_password" minlength="8"
             maxlength="72" autocomplete="new-password" required>

      <label class="terms">
        <input type="checkbox" name="terms" value="yes" required>
        <span>I agree to the terms and privacy policy.</span>
      </label>

      <button type="submit">Create Account →</button>
    </form>

    <p class="footer">© 2026 Fortune Cloud. All rights reserved.</p>
  </main>
</body>
</html>
